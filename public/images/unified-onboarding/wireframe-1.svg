  <text x="222" y="316" font-family="Arial, sans-serif" font-size="11" fill="#A08030">Shown once · copy-to-clipboard</text>
  <line x1="208" y1="290" x2="180" y2="291" stroke="#DCC060" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#tip)"/>

  <text x="60" y="388" font-family="Arial, sans-serif" font-size="11" fill="#8FA8C0">Credentials encrypted at rest and never logged</text>

