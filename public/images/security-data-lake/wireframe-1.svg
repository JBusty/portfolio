  <text x="164" y="422" font-family="Arial, sans-serif" font-size="10" fill="#A08030">Panel is drag-resizable</text>

  <!-- SQL editor -->
  <rect x="346" y="120" width="614" height="392" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="358" y="138" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#9999BB" letter-spacing="1">SQL EDITOR</text>

