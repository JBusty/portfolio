  <text x="180" y="260" font-family="Arial, sans-serif" font-size="10" fill="#999">timestamp</text>
  <text x="180" y="278" font-family="Arial, sans-serif" font-size="10" fill="#999">source_ip</text>
  <text x="164" y="300" font-family="Arial, sans-serif" font-size="11" fill="#666">▶ auth_logs</text>
