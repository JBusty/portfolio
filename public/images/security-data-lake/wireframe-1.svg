  <rect x="418" y="244" width="160" height="8" rx="2" fill="#E0E0E0"/>
  <text x="372" y="271" font-family="Arial, sans-serif" font-size="11" fill="#8FA8C0">WHERE</text>
  <rect x="428" y="264" width="220" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="372" y="287" width="300" height="8" rx="2" fill="#E0E0E0"/>
  <text x="372" y="307" font-family="Arial, sans-serif" font-size="11" fill="#8FA8C0">AND</text>
  <rect x="406" y="300" width="240" height="8" rx="2" fill="#E0E0E0"/>
  <text x="372" y="327" font-family="Arial, sans-serif" font-size="11" fill="#8FA8C0">LIMIT</text>
  <rect x="416" y="320" width="60" height="8" rx="2" fill="#E0E0E0"/>

  <!-- Action bar -->
  <rect x="358" y="402" width="588" height="50" fill="#FAFAFA" stroke="#EBEBEB" stroke-width="1"/>
  <rect x="370" y="414" width="100" height="26" rx="4" fill="#8FA8C0"/>
  <text x="385" y="430" font-family="Arial, sans-serif" font-size="11" fill="#FFF">▶  Run query</text>
  <text x="482" y="430" font-family="Arial, sans-serif" font-size="11" fill="#CCCCCC">Format</text>
  <text x="770" y="430" font-family="Arial, sans-serif" font-size="11" fill="#AAAAAA">~42,000 rows · 1.2s</text>

