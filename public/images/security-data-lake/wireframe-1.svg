  <text x="148" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">Security Data Lake</text>
  <circle cx="910" cy="23" r="16" fill="none" stroke="#E0E0E0" stroke-width="4"/>
  <circle cx="910" cy="23" r="16" fill="none" stroke="#8FA8C0" stroke-width="4" stroke-dasharray="54 46" stroke-dashoffset="16" stroke-linecap="round"/>
  <text x="901" y="20" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#5A7A9A">54%</text>
  <text x="899" y="30" font-family="Arial, sans-serif" font-size="8" fill="#AAA">quota</text>

